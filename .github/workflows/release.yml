# Push a tag like v1.0.0 → GitHub builds the Android APK and attaches it to a GitHub Release (free).
# The app checks this Release page on start and offers the update to the phone.
#
# Optional secrets (Settings → Secrets → Actions) for a signed APK:
#   I_KEYSTORE_BASE64   base64 of your .jks file   (base64 -i my.jks | pbcopy)
#   I_KEYSTORE_PASSWORD, I_KEY_ALIAS, I_KEY_PASSWORD
# Optional variable (Settings → Variables → Actions):
#   I_APP_URL           your hosted server, e.g. https://i-server.onrender.com
name: Release Android app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.I_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.I_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/i.jks" && echo "I_KEYSTORE_PATH=$RUNNER_TEMP/i.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
          I_KEYSTORE_PASSWORD: ${{ secrets.I_KEYSTORE_PASSWORD }}
          I_KEY_ALIAS: ${{ secrets.I_KEY_ALIAS }}
          I_KEY_PASSWORD: ${{ secrets.I_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          URL="${{ vars.I_APP_URL }}"
          ./gradlew assembleRelease ${URL:+-PI_APP_URL=$URL} -PI_GITHUB_REPO=${{ github.repository }}
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk "../out/i-${APP_VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: i-apk
          path: out/*.apk

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
