# On every push / PR: build the web UI, start the server and check the API answers, build a debug APK.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm ci || npm install
        working-directory: server
      - name: API tests
        run: node --test test/*.test.js
        working-directory: server
      - name: Smoke-test the API
        working-directory: server
        run: |
          PORT=4600 node src/index.js & sleep 3
          for p in health day/$(date +%F) week routine insights widget; do
            curl -fsS "localhost:4600/api/v1/$p" > /dev/null && echo "ok $p"
          done

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
