org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---- Where the app (WebView + widget) gets its screens and data ----
# Release builds (GitHub Releases, what you install on your phone): the live site on Vercel.
I_APP_URL=https://i-chi-amber.vercel.app
# Debug builds (Android Studio "Run", ./gradlew assembleDebug): your Mac's local server.
# 10.0.2.2 is "your Mac" as seen from the Android emulator. For a real phone on the same Wi-Fi,
# use your Mac's Wi-Fi address instead, e.g. http://192.168.1.20:4600
I_DEV_URL=http://10.0.2.2:4600

# ---- Google sign-in ----
# Your Google Cloud "Web application" OAuth client ID (public, not a secret).
# Android uses it to ask Google for a sign-in token the server can check.
I_GOOGLE_WEB_CLIENT_ID=200501593750-hir3poppidb88tg4j19bh800egdujpvi.apps.googleusercontent.com

# owner/repo on GitHub, used to check for new releases
I_GITHUB_REPO=itssinghankit/i
